<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cool Music Player</title>
  <link rel="icon" type="image/jpeg" href="web-logo/download.jpeg">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="center-title">बस वाला</div>
  <header class="topbar">
    <div></div>
    <div id="datetime" class="datetime" aria-live="polite"></div>
  </header>

  <div class="playlist-picker-wrap" aria-label="Playlist selector">
    <button id="moreOptionsButton" class="more-options" type="button" aria-label="More song options" aria-expanded="false">
      <img src="3 dot-icon/three dots Icon - Free PNG & SVG 870483 - Noun Project.jpeg" alt="">
    </button>
    <div id="quickOptions" class="quick-options" hidden>
      <button id="chooseCodeOption" type="button">Upload song code</button>
      <button id="switchViewOption" type="button">Switch player view</button>
    </div>
    <button id="scanmeButton" class="scanme-badge" type="button" aria-label="Upload a song barcode" aria-expanded="false">
      <img src="scanme-icon/car sticker qr code _ Do Not Scan_ Disappointing Qr Code Sticker.jpeg" alt="Scan me">
    </button>
    <div id="scanUploadPanel" class="scan-upload-panel" hidden>
      <strong>Play from code</strong>
      <label class="upload-action" for="songCodeFile">Choose barcode file</label>
      <input id="songCodeFile" type="file" accept="image/*,.txt,.json">
      <span id="scanUploadStatus" role="status">Upload a code image or text file.</span>
    </div>
    <div class="playlist-picker">
      <div class="playlist-icon" aria-hidden="true"></div>
      <label class="visually-hidden" for="playlistSelect">Choose playlist</label>
      <select id="playlistSelect" aria-label="Choose playlist" value="kk">
        <option value="kk">KK Playlist</option>
        <option value="busWala">Bus Wala Playlist</option>
        <option value="love">Love Playlist</option>
        <option value="drZeusKangna">Dr Zeus Kangna</option>
        <option value="rajasthaniBanger">Rajasthani Banger</option>
        <option value="saiAbhyankar">Sai Abhyankar</option>
        <option value="oliviaDean">Olivia Dean</option>
        <option value="olivia">Olivia Playlist</option>
        <option value="southIndianBanger">South indian Banger</option>
        <option value="kishorKumar">Kishor Kumar</option>
      </select>
    </div>
  </div>

  <main class="stage">
    <!-- main content can go here -->
  </main>

  <div class="bottom-player">
    <div class="player-card">
      <div class="art"></div>
      <div class="meta">
        <div class="track-title" id="trackTitle">Loading...</div>
        <div class="controls">
          <button id="prevBtn" class="control" aria-label="Previous track">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5.5h2.2v13H6zm11.8 1.3L10.8 12l7 5.2zM9.2 12L18 6.8v10.4z"/></svg>
          </button>
          <button id="replayBtn" class="control" aria-label="Replay">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5A7.5 7.5 0 1 1 4.5 12h2.2A5.3 5.3 0 1 0 12 6.7v2.2l4-3.2-4-3.1z"/></svg>
          </button>
          <button id="playPauseBtn" class="control large" aria-label="Play or pause">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-play"><path d="M8 6.4v11.2l9.2-5.6z"/></svg>
          </button>
          <button id="nextBtn" class="control" aria-label="Next track">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5.5h2.2v13H16zm-11.8 1.3L13.2 12l-9 5.2zM14.8 12L6 6.8v10.4z"/></svg>
          </button>
          <button id="shuffleBtn" class="control" aria-label="Shuffle">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.8 5.2h3.7v3.7h-1.9V8l-4.5 4.5-1.3-1.3L16.3 6.7h-.5zm-6 10.7L4.5 18.8l1.3 1.3 5.2-5.2-1.3-1.3zm9.7 2.9h-3.7v-1.9h1.8l-3.6-3.6 1.3-1.3 3.6 3.6h.6v-1.9h1.9v3.7z"/></svg>
          </button>
          <button id="loopBtn" class="control" aria-label="Loop">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 7.2h9.6a4.2 4.2 0 1 1 0 8.4H14v-2h2.8a2.2 2.2 0 1 0 0-4.4H7.2A2.2 2.2 0 1 0 7.2 15H9v2H7.2a4.2 4.2 0 1 1 0-8.4zm7.8 4.6v2.2l3.4-2.2-3.4-2.2z"/></svg>
          </button>
        </div>
        <div id="songCode" class="song-code" role="img" aria-label="Song code"></div>

        <div class="progress-row">
          <span id="currentTime">0:00</span>
          <div id="progress" class="progress" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="progressBar" class="progress-bar"></div>
          </div>
          <span id="duration">0:00</span>
        </div>
      </div>
    </div>
  </div>

  <section id="secondView" class="second-view" hidden aria-label="Alternative music player view">
    <div class="second-device">
      <div class="second-screen">
        <img id="secondThumbnail" src="components-2nd view/download (1).jpeg" alt="Current song artwork">
      </div>
      <div class="second-device-title" id="secondTrackTitle">Loading...</div>
      <div class="second-progress">
        <span id="secondCurrentTime">0:00</span>
        <div class="second-progress-track"><div id="secondProgressBar"></div></div>
        <span id="secondDuration">0:00</span>
      </div>
      <div class="second-controls" aria-label="Player controls">
        <button class="second-control" data-player-action="prev" aria-label="Previous track">|&lt;</button>
        <button class="second-control" data-player-action="replay" aria-label="Replay">&#8634;</button>
        <button class="second-control second-play" data-player-action="play" aria-label="Play or pause">&#9654;</button>
        <button class="second-control" data-player-action="next" aria-label="Next track">&gt;|</button>
        <button class="second-control" data-player-action="shuffle" aria-label="Shuffle">&#8646;</button>
        <button class="second-control" data-player-action="loop" aria-label="Loop">&#8734;</button>
      </div>
    </div>
  </section>

  <audio id="audio"></audio>
  <div id="yt-player" style="position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none"></div>

  <script src="script.js"></script>
</body>
</html>
